name: Deploy Anime or Not

# 1. THE TRIGGER
on:
  push:
    branches:
      - main

jobs:
  # 2. THE BUILD JOB
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/anime-or-not:latest

  # 3. THE DEPLOY JOB
  deploy-to-ec2:
    needs: build-and-push  # Waits for the build to finish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # This script runs ON your EC2 server!
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/anime-or-not:latest
            docker stop anime-app || true
            docker rm anime-app || true
            docker run -d -p 80:80 --name anime-app ${{ secrets.DOCKERHUB_USERNAME }}/anime-or-not:latest